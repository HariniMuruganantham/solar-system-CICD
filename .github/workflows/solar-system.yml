name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_CLUSTER: ${{ vars.MONGO_CLUSTER }}
  MONGO_DB: ${{ vars.MONGO_DB }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}

  MONGO_URI: mongodb+srv://${{ vars.MONGO_USERNAME }}:${{ secrets.MONGO_PASSWORD }}@${{ vars.MONGO_CLUSTER }}/${{ vars.MONGO_DB }}?retryWrites=true&w=majority&appName=Cluster0

jobs:
  unit-testing:
    name: Unit Testing

    strategy:
      matrix:
        nodejs_version: [18, 19, 20]
        operating_system:
          - ubuntu-latest
          - macos-latest
        exclude:
          - nodejs_version: 18
            operating_system: macos-latest

    runs-on: ${{ matrix.operating_system }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
          path: test-results.xml
          retention-days: 5
          if-no-files-found: warn

  code-coverage:
    name: Code Coverage

    runs-on: ubuntu-latest

    needs: unit-testing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run coverage
        run: npm run coverage

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage/
          retention-days: 5
          if-no-files-found: warn